<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>❖ خمنــــها : المخطوطة العتيقة ❖</title>
    <style>
        /* ==========================================
           1. الخطوط المخصصة
        ========================================== */
        @font-face {
            font-family: 'Thmanyah-Bold';
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/thmanyah-family/thmanyahserifdisplay-Bold.otf');
            font-display: swap;
        }
        @font-face {
            font-family: 'Kaswa-Modern';
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/kaswa/Kaswa-Modern.ttf');
            font-display: swap;
        }
        @font-face {
            font-family: 'Hajeen';
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/hajeen/Hajeen-Regular.ttf');
            font-display: swap;
        }
        @font-face {
            font-family: 'Panorama-Naskh';
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/panorama-naksh/PanoramaNaskh-Scribble.ttf');
            font-display: swap;
        }
        @font-face {
            font-family: 'Milan-Black';
            src: url('https://cdn.jsdelivr.net/gh/morhafali5r-hub/M.F.L@main/MORHAF-Fonts/milan-display/Milan%20Display%20Black.otf');
            font-display: swap;
        }

        /* ==========================================
           2. المتغيرات والألوان (الطابع العتيق)
        ========================================== */
        :root {
            --bg-grad-1: #f4ecd8;
            --bg-grad-2: #e8dcc4;
            --text-dark: #3e2a14;
            --text-light: #5c3a21;
            
            --card-bg: #fbf8f1;
            --card-border: #d4c4a8;
            --shadow-color: #324016;
            --input-border: #b5a485;
            
            --correct-vintage: #4a5d23;  
            --present-vintage: #b08d57;  
            --absent-vintage: #8b7d6b;   
            --score-color: #b08d57;
        }

        /* ==========================================
           3. الإعدادات الأساسية والمؤثرات
        ========================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Hajeen', serif;
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            color: var(--text-dark);
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            position: relative; text-shadow: 0px 0px 1px rgba(62, 42, 20, 0.2);
        }

        /* مؤثرات الخلفية */
        #noise-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9999; opacity: 0.04; }
        .ambient-blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.5; z-index: 0; pointer-events: none; animation: float 20s infinite alternate ease-in-out; }
        .blob-1 { width: 300px; height: 300px; background: #d4a373; top: -50px; right: -50px; }
        .blob-2 { width: 400px; height: 400px; background: #faedcd; bottom: -100px; left: -50px; animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(-30px, 40px) scale(1.1); } }

        /* Floating Score */
        .floating-score {
            position: absolute; font-family: 'Kaswa-Modern', sans-serif; font-size: 2.2rem; color: var(--correct-vintage);
            pointer-events: none; z-index: 200; text-shadow: 1px 1px 0px var(--card-bg);
            animation: floatScore 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes floatScore { 0% { opacity: 0; transform: translateY(10px) scale(0.5); } 20% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { opacity: 0; transform: translateY(-70px) scale(1); } }

        /* ==========================================
           4. الأزرار والعناصر العتيقة
        ========================================== */
        button {
            font-family: 'Hajeen', sans-serif; font-size: 1.2rem;
            background: var(--card-bg); color: var(--text-dark);
            border: 2px solid var(--card-border); padding: 10px 20px;
            cursor: pointer; box-shadow: 2px 4px 0px var(--shadow-color);
            transition: all 0.15s ease; border-radius: 2px; outline: none;
            display: inline-flex; align-items: center; justify-content: center;
        }
        button:active:not(:disabled) { transform: translateY(4px); box-shadow: 0px 0px 0px var(--shadow-color); }
        button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: 1px 2px 0px var(--shadow-color); }
        
        button.primary {
            background: var(--text-dark); color: var(--bg-grad-1);
            border-color: var(--text-dark); box-shadow: 2px 4px 0px rgba(0,0,0,0.6);
            font-family: 'Thmanyah-Bold', serif; font-size: 1.5rem; padding: 12px 30px;
        }

        .category-badge {
            font-family: 'Thmanyah-Bold', serif; font-size: 1.6rem; color: var(--text-dark);
            background: rgba(212, 196, 168, 0.4); border: 2px dashed var(--card-border);
            padding: 5px 25px; border-radius: 4px; margin-bottom: 10px;
            display: inline-block; box-shadow: inset 0 0 10px rgba(0,0,0,0.05); text-align: center;
            flex-shrink: 0;
        }

        /* ==========================================
           5. القائمة الرئيسية
        ========================================== */
        .app-container { position: relative; z-index: 10; width: 100%; max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; height: 100%; }
        
        #main-menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.4s ease, transform 0.4s ease; padding: 20px;
        }

        .game-title {
            font-family: 'Thmanyah-Bold', serif; font-size: 5.5rem; color: var(--text-dark);
            margin-bottom: 2rem; text-align: center; line-height: 1.2;
            animation: floatTitle 3s ease-in-out infinite; text-shadow: 2px 2px 0px var(--card-border);
        }
        @keyframes floatTitle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .paper-card {
            background: var(--card-bg); border: 2px solid var(--card-border); padding: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.03), 0 4px 15px rgba(0,0,0,0.05); border-radius: 4px;
            width: 100%; text-align: center; margin-bottom: 20px;
        }

        .stats-cards { display: flex; gap: 1rem; width: 100%; margin-bottom: 2rem; }
        .stat-card {
            flex: 1; border: 1px dashed var(--input-border); padding: 1rem 0;
            background: rgba(212, 196, 168, 0.15);
        }
        .stat-card h3 { font-family: 'Kaswa-Modern', sans-serif; font-size: 2.5rem; color: var(--text-dark); }
        .stat-card p { font-family: 'Panorama-Naskh', serif; font-size: 1.2rem; color: var(--text-light); }

        /* ==========================================
           6. واجهة اللعب والمساعدات
        ========================================== */
        #game-view { display: none; flex-direction: column; height: 100%; }

        .header {
            display: flex; justify-content: space-between; align-items: center; padding: 15px;
            border-bottom: 2px dashed var(--card-border); flex-shrink: 0; z-index: 20;
        }
        
        .points-badge {
            font-family: 'Kaswa-Modern', sans-serif; font-size: 1.5rem; color: var(--score-color);
            background: var(--card-bg); border: 2px solid var(--score-color); padding: 5px 15px;
            border-radius: 2px; box-shadow: 2px 3px 0px var(--score-color); display: flex; align-items: center; gap: 5px;
        }

        .shop-container {
            display: flex; gap: 10px; padding: 15px; overflow-x: auto; scrollbar-width: none;
            border-bottom: 2px double var(--card-border); flex-shrink: 0;
        }
        .shop-container::-webkit-scrollbar { display: none; }

        .shop-item {
            background: var(--card-bg); border: 2px solid var(--card-border); min-width: 90px;
            padding: 10px 5px; display: flex; flex-direction: column; align-items: center;
            box-shadow: 2px 4px 0px var(--card-border); cursor: pointer; transition: all 0.1s;
        }
        .shop-item:active { transform: translateY(4px); box-shadow: 0px 0px 0px var(--card-border); }
        .shop-item.locked { opacity: 0.5; filter: grayscale(1); pointer-events: none; box-shadow: 1px 2px 0px var(--card-border); }
        
        .shop-icon { font-size: 1.6rem; margin-bottom: 5px; }
        .shop-name { font-family: 'Kaswa-Modern', sans-serif; font-size: 1.1rem; color: var(--text-dark); }
        .shop-price { font-family: 'Kaswa-Modern', sans-serif; font-size: 1rem; color: var(--score-color); margin-top: 2px; }

        .persistent-hint {
            display: none; text-align: center; padding: 8px; margin-bottom: 10px;
            background: rgba(212, 196, 168, 0.3); border: 1px dashed var(--present-vintage);
            font-family: 'Panorama-Naskh', serif; font-size: 1.2rem; color: var(--text-dark);
            animation: popIn 0.3s forwards; flex-shrink: 0; width: 100%; border-radius: 4px;
        }
        .persistent-hint span { color: var(--present-vintage); font-weight: bold; }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* ==========================================
           7. لوحة المربعات (Grid لـ 7 محاولات)
        ========================================== */
        .board-wrapper {
            flex: 1; display: flex; flex-direction: column; align-items: center; 
            justify-content: flex-start; padding: 10px 15px; overflow-y: auto; perspective: 1000px;
        }

        .board { display: grid; gap: 6px; margin: auto; padding-bottom: 10px; }
        .row { display: flex; gap: 6px; justify-content: center; }

        .tile {
            width: 55px; height: 55px; position: relative;
            transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tile-face {
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Milan-Black', sans-serif; font-size: 2rem; border-radius: 2px;
        }
        
        .tile-front {
            background: transparent; border: 2px dashed var(--input-border); color: var(--text-dark);
            transition: border 0.1s;
        }
        .tile.active .tile-front { border: 2px solid var(--text-dark); background: rgba(251, 248, 241, 0.5); transform: scale(1.05); }

        .tile-back { transform: rotateX(180deg); border: 2px solid; color: #fbf8f1; text-shadow: 1px 1px 0px rgba(0,0,0,0.2); }
        .tile-back.correct { background: var(--correct-vintage); border-color: var(--correct-vintage); }
        .tile-back.present { background: var(--present-vintage); border-color: var(--present-vintage); }
        .tile-back.absent { background: var(--absent-vintage); border-color: var(--absent-vintage); }
        
        .tile.flip { transform: rotateX(180deg); }

        /* ==========================================
           8. لوحة المفاتيح (معدلة حسب شاشة الموبايل)
        ========================================== */
        .keyboard {
            padding: 10px 3px 15px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px;
            border-top: 2px dashed var(--card-border); background: rgba(234, 227, 200, 0.5);
        }
        .key-row { display: flex; justify-content: center; gap: 4px; width: 100%; max-width: 500px; margin: 0 auto; }

        .key {
            flex: 1; height: 48px; min-width: 0; padding: 0;
            background: var(--card-bg); color: var(--text-dark); font-family: 'Milan-Black', sans-serif; font-size: 1.3rem;
            border: 1px solid var(--card-border); box-shadow: 1px 3px 0px var(--card-border);
            display: flex; justify-content: center; align-items: center; border-radius: 2px;
            cursor: pointer; transition: transform 0.05s, box-shadow 0.05s;
        }
        .key:active { transform: translateY(3px); box-shadow: 0px 0px 0px var(--card-border); }
        .key.large { flex: 1.5; font-size: 1rem; font-family: 'Kaswa-Modern', sans-serif; }
        
        .key.correct { background: var(--correct-vintage); color: #fbf8f1; border-color: var(--correct-vintage); box-shadow: 1px 3px 0px rgba(0,0,0,0.3); }
        .key.present { background: var(--present-vintage); color: #fbf8f1; border-color: var(--present-vintage); box-shadow: 1px 3px 0px rgba(0,0,0,0.3); }
        .key.absent { background: var(--absent-vintage); color: rgba(255,255,255,0.7); border-color: var(--absent-vintage); box-shadow: 1px 3px 0px rgba(0,0,0,0.3); }
        .key.hidden { opacity: 0; pointer-events: none; }

        /* تصغير ديناميكي للشاشات الصغيرة */
        @media (max-height: 750px) {
            .tile { width: 45px; height: 45px; font-size: 1.7rem; }
            .board { gap: 5px; } .row { gap: 5px; }
            .header { padding: 10px; } .shop-container { padding: 10px; }
        }
        @media (max-height: 650px) {
            .tile { width: 40px; height: 40px; font-size: 1.5rem; }
            .board { gap: 4px; } .row { gap: 4px; }
            .category-badge { font-size: 1.4rem; padding: 2px 15px; margin-bottom: 5px; }
            .keyboard { padding-bottom: 10px; gap: 5px; }
            .key { height: 42px; font-size: 1.2rem; }
        }

        /* ==========================================
           9. النوافذ والتأثيرات
        ========================================== */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(62, 42, 20, 0.8); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
            opacity: 0; transition: opacity 0.4s ease;
        }
        .overlay.active { opacity: 1; display: flex; }

        .modal {
            background: var(--bg-grad-1); border: 2px solid var(--card-border); padding: 30px 20px;
            width: 90%; max-width: 400px; text-align: center; border-radius: 4px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4); transform: translateY(20px); transition: all 0.4s;
        }
        .overlay.active .modal { transform: translateY(0); }

        .modal h2 { font-family: 'Thmanyah-Bold', serif; font-size: 3rem; margin-bottom: 10px; color: var(--text-dark); }
        .modal .word-reveal { font-family: 'Milan-Black', sans-serif; font-size: 3rem; color: var(--text-dark); margin: 15px 0; }
        .modal .hint-reveal { font-family: 'Panorama-Naskh', serif; font-size: 1.3rem; color: var(--text-light); margin-bottom: 25px; }

        .toast {
            position: fixed; top: 100px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: var(--text-dark); color: var(--bg-grad-1); font-family: 'Panorama-Naskh', serif;
            padding: 10px 20px; border-radius: 2px; font-size: 1.3rem; z-index: 2000;
            opacity: 0; pointer-events: none; transition: all 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3); border: 1px dashed var(--card-border);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .shake { animation: shakeRow 0.5s both; }
        @keyframes shakeRow { 10%, 90% { transform: translateX(-4px); } 20%, 80% { transform: translateX(6px); } 30%, 50%, 70% { transform: translateX(-10px); } 40%, 60% { transform: translateX(10px); } }
        
        .particle { position: absolute; pointer-events: none; border-radius: 50%; z-index: 1000; animation: explode 1.2s forwards ease-out; }
        @keyframes explode { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
    </style>
</head>
<body>

    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <svg id="noise-overlay"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#noiseFilter)"/></svg>

    <div class="app-container">
        
        <!-- القائمة الرئيسية -->
        <div id="main-menu">
            <div class="game-title">خمنــــها</div>
            
            <div class="paper-card">
                <div class="stats-cards" style="margin-bottom:0; border:none;">
                    <div class="stat-card">
                        <h3 id="menu-points">0</h3>
                        <p>النقاط</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="menu-streak">0</h3>
                        <p>المراحل</p>
                    </div>
                </div>
            </div>

            <button class="primary" style="margin-bottom: 15px; width:100%;" onclick="startGame()">بدء الحكاية</button>
            <button style="width:100%; margin-bottom: 10px;" onclick="openSettings()">إدارة السجلات ⚙️</button>
        </div>

        <!-- واجهة اللعبة -->
        <div id="game-view">
            <div class="header">
                <button style="padding: 5px 15px; box-shadow: 1px 2px 0px var(--shadow-color);" onclick="quitGame()">العودة ↢</button>
                <div class="points-badge" id="points-badge-ui"><span id="game-points">0</span> 🌟</div>
            </div>

            <!-- تم تعديل أسعار المساعدات هنا لزيادة الصعوبة -->
            <div class="shop-container" id="shop">
                <div class="shop-item" onclick="buyItem('hint', 30)" id="shop-hint"><div class="shop-icon">💡</div><div class="shop-name">تلميح</div><div class="shop-price">30 🌟</div></div>
                <div class="shop-item" onclick="buyItem('reveal', 40)" id="shop-reveal"><div class="shop-icon">👁‍🗨</div><div class="shop-name">كشف حرف</div><div class="shop-price">40 🌟</div></div>
                <div class="shop-item" onclick="buyItem('extra', 60)" id="shop-extra"><div class="shop-icon">➕</div><div class="shop-name">محاولة</div><div class="shop-price">60 🌟</div></div>
                <div class="shop-item" onclick="buyItem('remove', 50)" id="shop-remove"><div class="shop-icon">✕</div><div class="shop-name">حذف ٧ أخطاء</div><div class="shop-price">50 🌟</div></div>
            </div>

            <!-- الحاوية المرنة للتصنيف واللوحة -->
            <div class="board-wrapper" id="board-container">
                <div id="category-display" class="category-badge">التصنيف: </div>
                <div id="persistent-hint" class="persistent-hint"></div>
                <div class="board" id="board"></div>
            </div>

            <div class="keyboard" id="keyboard"></div>
        </div>

    </div>

    <!-- نافذة النهاية -->
    <div class="overlay" id="end-overlay">
        <div class="modal">
            <h2 id="end-title" style="font-family: 'Thmanyah-Bold', serif;">النتيجة</h2>
            <div class="word-reveal" id="end-word">الكلمة</div>
            <div class="hint-reveal" id="end-hint">التلميح</div>
            
            <div class="stats-cards" style="margin-bottom: 20px;">
                <div class="stat-card" style="background:transparent; border-style:solid; border-color:var(--correct-vintage);">
                    <h3 id="end-earned" style="color: var(--correct-vintage);">+0</h3>
                    <p>مكتسبة</p>
                </div>
                <div class="stat-card" style="background:transparent; border-style:solid; border-color:var(--present-vintage);">
                    <h3 id="end-combo" style="color: var(--present-vintage);">0</h3>
                    <p>متتالية</p>
                </div>
            </div>
            
            <button class="primary" style="width: 100%; margin-bottom: 10px;" onclick="startGame()">المرحلة التالية</button>
            <button style="width: 100%;" onclick="quitGame()">سجل القرية</button>
        </div>
    </div>

    <!-- الإعدادات -->
    <div class="overlay" id="settings-overlay">
        <div class="modal">
            <h2 style="font-family: 'Thmanyah-Bold', serif;">السجلات 📜</h2>
            <div style="display: flex; flex-direction: column; gap: 15px; margin: 25px 0;">
                <button style="width: 100%;" onclick="toggleSound()" id="btn-sound">🔊 الصوت: مفعل</button>
                <button style="width: 100%; color: var(--accent-red); border-color: var(--accent-red);" onclick="resetStats()">⚠️ مسح الأقدار (تصفير)</button>
            </div>
            <button class="primary" style="width: 100%;" onclick="closeSettings()">حفظ الأقدار</button>
        </div>
    </div>

    <div class="toast" id="toast">رسالة</div>

    <!-- المنطق البرمجي (JS) -->
    <script>

                if (type === 'tap') { osc.frequency.setValueAtTime(400, t); osc.type = 'sine'; gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t+0.05); osc.start(t); osc.stop(t+0.05); }
                else if (type === 'err') { osc.frequency.setValueAtTime(150, t); osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.2); osc.start(t); osc.stop(t+0.2); }
                else if (type === 'flip') { osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(600, t+0.1); osc.type = 'triangle'; gain.gain.setValueAtTime(0.05, t); gain.gain.linearRampToValueAtTime(0, t+0.1); osc.start(t); osc.stop(t+0.1); }
                else if (type === 'win') { osc.frequency.setValueAtTime(400, t); osc.frequency.setValueAtTime(600, t+0.1); osc.type = 'square'; gain.gain.setValueAtTime(0.08, t); gain.gain.linearRampToValueAtTime(0, t+0.6); osc.start(t); osc.stop(t+0.6); }
                else if (type === 'lose') { osc.frequency.setValueAtTime(250, t); osc.frequency.linearRampToValueAtTime(100, t+0.5); osc.type = 'sawtooth'; gain.gain.setValueAtTime(0.1, t); gain.gain.linearRampToValueAtTime(0, t+0.5); osc.start(t); osc.stop(t+0.5); }
                else if (type === 'coin') { osc.frequency.setValueAtTime(1200, t); osc.frequency.setValueAtTime(1800, t+0.1); osc.type = 'sine'; gain.gain.setValueAtTime(0.08, t); gain.gain.linearRampToValueAtTime(0, t+0.3); osc.start(t); osc.stop(t+0.3); }
            } catch(e) {}
        }

        /* --- التهيئة --- */
        function init() { updateMenu(); buildKeyboard(); updateSetUI(); }
        function updateMenu() { document.getElementById('menu-points').innerText = stats.points; document.getElementById('menu-streak').innerText = stats.streak; document.getElementById('game-points').innerText = stats.points; }
        function saveStats() { localStorage.setItem('khamenha_pro_v9', JSON.stringify(stats)); updateMenu(); }

        /* --- التدفق --- */
        function startGame() {
            document.getElementById('main-menu').style.opacity = '0'; document.getElementById('main-menu').style.pointerEvents = 'none';
            setTimeout(() => {
                let r = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
                targetWord = r.w; hint = r.h; targetCategory = r.c || "عام";
                currentGuess = []; currentRow = 0; maxAttempts = 7;
                locked = []; discoveredPositions = []; gameActive = true; 
                hintBought = false; removeBought = false; // تصفير المشتريات
                
                document.getElementById('category-display').innerText = `التصنيف: ${targetCategory}`;
                document.getElementById('persistent-hint').style.display = 'none';
                
                resetKb(); buildBoard(); updateShop();
                document.getElementById('game-view').style.display = 'flex';
                document.getElementById('end-overlay').classList.remove('active');
            }, 300);
        }
        function quitGame() { document.getElementById('game-view').style.display = 'none'; document.getElementById('main-menu').style.opacity = '1'; document.getElementById('main-menu').style.pointerEvents = 'auto'; gameActive = false; }

        /* --- بناء الواجهة --- */
        function buildBoard() {
            const b = document.getElementById('board'); b.innerHTML = '';
            for(let i=0; i<maxAttempts; i++){
                let r = document.createElement('div'); r.className = 'row'; r.id = `row-${i}`;
                for(let j=0; j<targetWord.length; j++) r.innerHTML += `<div class="tile" id="tile-${i}-${j}"><div class="tile-face tile-front"></div><div class="tile-face tile-back"></div></div>`;
                b.appendChild(r);
            }
        }

        function buildKeyboard() {
            const kb = document.getElementById('keyboard'); kb.innerHTML = '';
            // الترتيب مطابق بالضبط لكيبورد الموبايل القياسي (من اليمين لليسار)
            const layout = [
                ['د','ج','ح','خ','ه','ع','غ','ف','ق','ث','ص','ض'],
                ['ط','ك','م','ن','ت','ا','ل','ب','ي','س','ش'],
                ['DEL','ظ','ز','و','ة','ى','ر','ؤ','ء','ئ'],
                ['ENTER', 'ذ']
            ];
            layout.forEach(row => {
                let r = document.createElement('div'); r.className = 'key-row';
                row.forEach(k => {
                    let btn = document.createElement('div'); btn.className = 'key';
                    if(k==='ENTER'){ btn.innerText='إدخال'; btn.classList.add('large'); btn.onclick=submit; }
                    else if(k==='DEL'){ btn.innerHTML='✕'; btn.classList.add('large'); btn.onclick=del; }
                    else { btn.innerText=k; btn.id=`key-${k}`; btn.onclick=()=>add(k); }
                    r.appendChild(btn);
                });
                kb.appendChild(r);
            });
        }
        function resetKb() { document.querySelectorAll('.key').forEach(k => { k.className = 'key'; if(k.innerText==='إدخال' || k.innerHTML==='✕') k.classList.add('large'); }); }

        /* --- الكتابة --- */
        function add(l) {
            if(!gameActive || currentGuess.length >= targetWord.length) return;
            let idx = currentGuess.length; while(locked.includes(idx)) { currentGuess.push(targetWord[idx]); idx++; }
            if(currentGuess.length < targetWord.length) { currentGuess.push(l); updateRow(); playSfx('tap'); }
        }
        function del() {
            if(!gameActive || currentGuess.length===0) return;
            let idx = currentGuess.length - 1; while(locked.includes(idx) && idx>=0) idx--;
            if(idx>=0) { currentGuess.splice(idx); updateRow(); playSfx('tap'); }
        }
        function updateRow() {
            let tiles = document.getElementById(`row-${currentRow}`).querySelectorAll('.tile');
            tiles.forEach((t, i) => {
                if(!locked.includes(i)){
                    t.querySelector('.tile-front').innerText = currentGuess[i] || '';
                    if(currentGuess[i]) t.classList.add('active'); else t.classList.remove('active');
                }
            });
        }

        /* --- المنطق --- */
        function submit() {
            if(!gameActive) return;
            if(currentGuess.length !== targetWord.length) { 
                toast("المخطوطة ناقصة!"); let rw = document.getElementById(`row-${currentRow}`);
                rw.classList.remove('shake'); void rw.offsetWidth; rw.classList.add('shake'); playSfx('err'); return; 
            }
            check(currentGuess.join(''));
        }

        function check(g) {
            gameActive = false;
            let tiles = document.getElementById(`row-${currentRow}`).querySelectorAll('.tile');
            let tArr = targetWord.split(''); let res = Array(targetWord.length).fill('absent'); let ptsThisTurn = 0;

            for(let i=0; i<targetWord.length; i++) {
                if(g[i]===targetWord[i]) { res[i]='correct'; tArr[i]=null; if(!locked.includes(i) && !discoveredPositions.includes(i)) { ptsThisTurn += 1; discoveredPositions.push(i); } }
            }
            for(let i=0; i<targetWord.length; i++) {
                if(res[i]==='absent' && tArr.includes(g[i])) { res[i]='present'; tArr[tArr.indexOf(g[i])]=null; }
            }

            tiles.forEach((t, i) => {
                setTimeout(() => {
                    t.querySelector('.tile-back').innerText = g[i]; t.querySelector('.tile-back').classList.add(res[i]);
                    t.classList.add('flip'); playSfx('flip');
                    let k = document.getElementById(`key-${g[i]}`);
                    if(k) {
                        if(res[i]==='correct') { k.classList.remove('present','absent'); k.classList.add('correct'); }
                        else if(res[i]==='present' && !k.classList.contains('correct')) { k.classList.remove('absent'); k.classList.add('present'); }
                        else if(res[i]==='absent' && !k.classList.contains('correct') && !k.classList.contains('present')) k.classList.add('absent');
                    }
                    if(i === targetWord.length-1) setTimeout(()=> endTurn(ptsThisTurn, g===targetWord), 400);
                }, i * 200);
            });
        }

        function endTurn(ptsThisTurn, isWin) {
            if(ptsThisTurn > 0) { stats.points += ptsThisTurn; saveStats(); updateShop(); showFloatingPoints(ptsThisTurn); }
            if(isWin) { winGame(); } else {
                currentRow++;
                if(currentRow >= maxAttempts) loseGame();
                else {
                    currentGuess=[]; gameActive=true;
                    locked.forEach(idx => {
                        let t = document.getElementById(`row-${currentRow}`).querySelectorAll('.tile')[idx];
                        t.querySelector('.tile-front').innerText = targetWord[idx];
                        t.querySelector('.tile-front').style.color = 'var(--correct-vintage)';
                    });
                }
            }
        }

        /* --- المؤثرات --- */
        function showFloatingPoints(pts) {
            let fs = document.createElement('div'); fs.className = 'floating-score'; fs.innerText = `+${pts}`;
            let badge = document.getElementById('points-badge-ui'); let rect = badge.getBoundingClientRect();
            fs.style.left = `${rect.left + (rect.width / 2) - 15}px`; fs.style.top = `${rect.top}px`;
            document.body.appendChild(fs); setTimeout(() => fs.remove(), 1200);
        }
        function toast(m) { let t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(()=> t.classList.remove('show'), 2000); }
        function confetti() {
            let cols = ['var(--correct-vintage)', 'var(--present-vintage)', 'var(--text-dark)'];
            for(let i=0; i<40; i++){
                let p = document.createElement('div'); p.className='particle'; p.style.width = p.style.height = (Math.random()*10+5)+'px';
                p.style.background = cols[Math.floor(Math.random()*cols.length)]; p.style.left = '50%'; p.style.top = '50%';
                let a = Math.random()*Math.PI*2; let d = Math.random()*200+50;
                p.style.setProperty('--tx', Math.cos(a)*d+'px'); p.style.setProperty('--ty', Math.sin(a)*d+'px');
                document.body.appendChild(p); setTimeout(()=>p.remove(), 1200);
            }
        }

        /* --- النهاية والمتجر --- */
        function winGame() {
            playSfx('win'); stats.wins++; stats.streak++; confetti();
            let totalWinPoints = 2 + ((maxAttempts - currentRow - 1) * 2) + (stats.streak > 1 ? stats.streak * 2 : 0);
            stats.points += totalWinPoints; saveStats(); updateShop();
            if(totalWinPoints > 0) setTimeout(() => showFloatingPoints(totalWinPoints), 500);
            setTimeout(() => {
                document.getElementById('end-title').innerText = "نجاح 📜"; document.getElementById('end-title').style.color = "var(--correct-vintage)";
                document.getElementById('end-word').innerText = targetWord; document.getElementById('end-hint').innerText = hint;
                document.getElementById('end-earned').innerText = `+${totalWinPoints}`; document.getElementById('end-combo').innerText = `x${stats.streak}`;
                document.getElementById('end-overlay').classList.add('active');
            }, 1000);
        }

        function loseGame() {
            playSfx('lose'); stats.streak = 0; saveStats();
            setTimeout(() => {
                document.getElementById('end-title').innerText = "فشل ✖"; document.getElementById('end-title').style.color = "var(--text-dark)";
                document.getElementById('end-word').innerText = targetWord; document.getElementById('end-hint').innerText = hint;
                document.getElementById('end-earned').innerText = "0"; document.getElementById('end-combo').innerText = "0";
                document.getElementById('end-overlay').classList.add('active');
            }, 1000);
        }

        function updateShop() {
            const items = [{id:'shop-hint',c:30},{id:'shop-reveal',c:40},{id:'shop-extra',c:60},{id:'shop-remove',c:50}];
            items.forEach(i => { 
                let el = document.getElementById(i.id); 
                // قفل الأزرار إذا النقاط قليلة أو تم استخدام الميزة (التلميح وحذف الأخطاء يتم استخدامها مرة واحدة)
                if(stats.points < i.c || (i.id === 'shop-hint' && hintBought) || (i.id === 'shop-remove' && removeBought)) {
                    el.classList.add('locked'); 
                } else {
                    el.classList.remove('locked'); 
                }
            });
        }
        
        function buyItem(t, c) {
            if(!gameActive || stats.points < c) return;
            if(t === 'hint' && hintBought) return;
            if(t === 'remove' && removeBought) return;

            if(t === 'hint') { 
                hintBought = true; let pHint = document.getElementById('persistent-hint'); pHint.innerHTML = `💡 تلميح: <span>${hint}</span>`; pHint.style.display = 'block'; playSfx('coin'); 
            }
            else if(t === 'reveal') {
                let av = []; for(let i=0; i<targetWord.length; i++) if(!locked.includes(i) && currentGuess[i]!==targetWord[i]) av.push(i);
                if(av.length===0){ toast("الكلمة مكشوفة!"); return; }
                let r = av[Math.floor(Math.random()*av.length)]; locked.push(r); discoveredPositions.push(r); 
                let tile = document.getElementById(`row-${currentRow}`).querySelectorAll('.tile')[r];
                tile.querySelector('.tile-front').innerText = targetWord[r]; tile.querySelector('.tile-front').style.color = 'var(--correct-vintage)';
                let k = document.getElementById(`key-${targetWord[r]}`); if(k) k.classList.add('correct'); toast("تم كشف حرف!"); playSfx('coin');
            }
            else if(t === 'extra') {
                maxAttempts++; let r = document.createElement('div'); r.className='row'; r.id=`row-${maxAttempts-1}`;
                for(let j=0; j<targetWord.length; j++) r.innerHTML += `<div class="tile"><div class="tile-face tile-front"></div><div class="tile-face tile-back"></div></div>`;
                document.getElementById('board').appendChild(r); toast("أضيفت محاولة!"); playSfx('coin');
            }
            else if(t === 'remove') {
                let rm=0; 
                // خلط المفاتيح بشكل عشوائي لكي لا يحذف أول الأحرف فقط
                let keys = Array.from(document.querySelectorAll('.key')).sort(() => Math.random() - 0.5);
                keys.forEach(k => { 
                    let l = k.innerText; 
                    if(l.length===1 && !targetWord.includes(l) && !k.classList.contains('absent') && !k.classList.contains('hidden') && rm < 7){ 
                        k.classList.add('hidden'); rm++; 
                    } 
                });
                if(rm === 0) { toast("لا يوجد أحرف للحذف!"); return; }
                removeBought = true;
                toast(`حُذفت ٧ أحرف خاطئة!`); playSfx('coin');
            }
            stats.points -= c; saveStats(); updateShop();
        }

        /* --- الإعدادات --- */
        function openSettings(){ document.getElementById('settings-overlay').classList.add('active'); }
        function closeSettings(){ document.getElementById('settings-overlay').classList.remove('active'); }
        function toggleSound(){ settings.sound = !settings.sound; updateSetUI(); localStorage.setItem('khamenha_set_pro_v9', JSON.stringify(settings)); }
        function updateSetUI(){ document.getElementById('btn-sound').innerText = settings.sound ? "🔊 الصوت: مفعل" : "🔇 الصوت: معطل"; }
        function resetStats(){ if(confirm("هل أنت متأكد من تصفير الأقدار؟")){ stats={points:0,streak:0,wins:0}; saveStats(); toast("تم التصفير!"); closeSettings(); } }

        window.onload = init;
    </script>
